<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Mini gesto de notas</title>
</head>
<body>
    <main>
        <h1>Gestor de Notas</h1>
        <p>By Enmanuel Feliciano</p>
        <div class="crear_nota">
            <article>
                <input id="titulo_nota" type="text" placeholder="Título">
                <textarea id="descripcion_nota" placeholder="Escribe una nota..."></textarea>
                <button id="añadir_nota">Añadir nota</button>
            </article>
        </div> 
        <div class="notas_generadas">
        </div>     
    </main>
<script src="app.js"></script>
</body>
</html>
